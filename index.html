<!DOCTYPE html>
<html lang="en">
<head>
  <script>if (new URLSearchParams(location.search).has("editor")) location.replace("editor.html");</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>NicoM701</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-white-v2.svg" />
  <style>
    @layer ui-sdk;
    :root {
      --stage-w: 1320px;
      --stage-h: 660px;
      --stage-scale: 1;
      --bg: #000;
      --ink: #f5f2ed;
      --muted: #a9a6a0;
      --edge: rgba(255, 255, 255, 0.1);
      --shadow-strength: 0.38;
      --shadow-size: 0.36;
      --card-shadow-y: calc(8px + 22px * var(--shadow-size));
      --card-shadow-blur: calc(14px + 38px * var(--shadow-size));
      --item-shadow-y: calc(6px + 18px * var(--shadow-size));
      --item-shadow-blur: calc(8px + 28px * var(--shadow-size));
      --item-shadow-hover-y: calc(8px + 24px * var(--shadow-size));
      --item-shadow-hover-blur: calc(10px + 34px * var(--shadow-size));
      --item-shadow-drag-y: calc(10px + 30px * var(--shadow-size));
      --item-shadow-drag-blur: calc(14px + 44px * var(--shadow-size));
      --sticker-shadow-y: calc(5px + 15px * var(--shadow-size));
      --sticker-shadow-blur: calc(6px + 20px * var(--shadow-size));
      --shadow: 0 var(--card-shadow-y) var(--card-shadow-blur) rgb(0 0 0 / calc(36% * var(--shadow-strength)));
      --item-shadow: drop-shadow(0 var(--item-shadow-y) var(--item-shadow-blur) rgb(0 0 0 / calc(26% * var(--shadow-strength))));
      --item-shadow-hover: drop-shadow(0 var(--item-shadow-hover-y) var(--item-shadow-hover-blur) rgb(0 0 0 / calc(34% * var(--shadow-strength))));
      --item-shadow-drag: drop-shadow(0 var(--item-shadow-drag-y) var(--item-shadow-drag-blur) rgb(0 0 0 / calc(42% * var(--shadow-strength))));
      --sticker-shadow: drop-shadow(0 var(--sticker-shadow-y) var(--sticker-shadow-blur) rgb(0 0 0 / calc(35% * var(--shadow-strength))));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background:
        radial-gradient(circle at 52% 46%, rgba(255, 255, 255, 0.045), transparent 34%),
        linear-gradient(180deg, #0c0c0d, #080809);
      overflow: hidden;
      isolation: isolate;
    }

    .toolbar {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 9000;
      display: flex;
      gap: 8px;
    }

    .tool-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(18, 18, 20, 0.82);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .tool-button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(32, 32, 35, 0.9);
    }

    .tool-button:focus-visible {
      outline: 2px solid #12f3df;
      outline-offset: 3px;
    }

    .moodboard {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--stage-w);
      height: var(--stage-h);
      transform: scale(var(--stage-scale));
      transform-origin: top left;
      touch-action: none;
      user-select: none;
      will-change: left, top, transform;
      opacity: 0;
    }

    html.stage-ready .moodboard {
      opacity: 1;
    }

    .collage-item {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      transform: rotate(var(--r));
      transform-origin: 50% 50%;
      z-index: var(--z);
      cursor: grab;
      filter: var(--item-shadow);
      transition: filter 160ms ease, transform 160ms ease;
      will-change: left, top, transform;
    }

    .collage-item:hover {
      transform: rotate(calc(var(--r) + var(--hover-r, 1.8deg))) translateY(var(--hover-y, -2px)) scale(var(--hover-scale, 1.01));
      filter: var(--item-shadow-hover);
    }

    .collage-item[data-alpha-hit="true"].is-alpha-miss {
      cursor: default;
    }

    .collage-item[data-alpha-hit="true"].is-alpha-miss:hover {
      transform: rotate(var(--r));
      filter: var(--item-shadow);
    }

    .collage-item.is-dragging {
      cursor: grabbing;
      transform: rotate(var(--r)) scale(1.025);
      filter: var(--item-shadow-drag);
      transition: none;
    }

    .collage-item * {
      pointer-events: none;
    }

    .media-card,
    .text-card,
    .ticket-card,
    .device-card,
    .tweet-card,
    .book-card,
    .drink-card,
    .sticker-card {
      width: 100%;
      overflow: hidden;
      background: var(--fill, #34383f);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
    }

    .media-card {
      position: relative;
      aspect-ratio: var(--ratio, 1 / 1);
    }

    .media-card::before,
    .media-card::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .media-card::before {
      opacity: 0.24;
      background:
        linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.38) 42% 47%, transparent 47%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 18px);
    }

    .media-card::after {
      inset: auto 14px 14px auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: rgba(0, 0, 0, 0.14);
    }

    .shape-rect {
      border-radius: 2.2%;
    }

    .shape-soft {
      border-radius: 8%;
    }

    .shape-circle {
      border-radius: 50%;
    }

    .shape-arch {
      border-radius: 50% 50% 7% 7% / 28% 28% 5% 5%;
    }

    .shape-squircle {
      border-radius: 30%;
    }

    .shape-cut {
      clip-path: polygon(7% 0, 100% 4%, 95% 100%, 0 92%);
    }

    .shape-diamond {
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }

    .shape-ticket {
      clip-path: polygon(0 0, 100% 0, 100% 38%, 93% 50%, 100% 62%, 100% 100%, 0 100%, 0 62%, 7% 50%, 0 38%);
    }

    .image-card {
      position: relative;
      width: 100%;
      aspect-ratio: var(--ratio, 1 / 1);
      overflow: hidden;
      background: #111217;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow);
    }

    .image-card img,
    .image-card video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: var(--fit, cover);
      object-position: var(--pos, center);
      user-select: none;
      -webkit-user-drag: none;
    }

    .image-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.24) 45%, transparent 52%),
        radial-gradient(circle at 78% 78%, rgba(255, 255, 255, 0.18), transparent 18%);
      mix-blend-mode: screen;
      opacity: var(--gloss, 0.34);
    }

    .foil-card {
      position: relative;
      width: 100%;
      aspect-ratio: var(--ratio, 1 / 1);
      overflow: visible;
      border: 0;
      background: transparent;
      box-shadow: none;
      perspective: 720px;
      transform-style: preserve-3d;
    }

    .foil-card::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 7%;
      bottom: -6%;
      height: 18%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      filter: blur(17px);
      transform: rotate(var(--shadow-r, -3deg));
      opacity: 0.72;
    }

    .foil-sheet {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      border-radius: var(--foil-radius, 14px);
      clip-path: var(--foil-cut, polygon(5% 1%, 97% 0, 100% 95%, 12% 100%, 0 38%));
      transform:
        perspective(620px)
        rotateX(var(--foil-rx, 6deg))
        rotateY(var(--foil-ry, -12deg))
        skewY(var(--foil-skew-y, -1deg));
      transform-origin: var(--foil-origin, 52% 54%);
      background: #0c0d10;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        inset 20px 0 26px rgba(255, 255, 255, 0.12),
        inset -22px 0 32px rgba(0, 0, 0, 0.44),
        inset 0 -18px 28px rgba(0, 0, 0, 0.36),
        0 28px 44px rgba(0, 0, 0, 0.48);
    }

    .foil-sheet img {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      display: block;
      object-fit: cover;
      object-position: var(--pos, center);
      user-select: none;
      -webkit-user-drag: none;
      filter:
        saturate(var(--foil-saturate, 1.42))
        contrast(var(--foil-contrast, 1.22))
        brightness(var(--foil-brightness, 0.94));
      transform: scale(var(--foil-img-scale, 1.04)) rotate(var(--foil-img-r, 0deg));
    }

    .foil-sheet::before,
    .foil-sheet::after,
    .foil-light,
    .foil-grain {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }

    .foil-sheet::before {
      inset: -26%;
      opacity: var(--rainbow-opacity, 0.7);
      mix-blend-mode: screen;
      background:
        conic-gradient(from var(--rainbow-angle, 22deg) at 46% 52%, rgba(255, 0, 112, 0.9), rgba(255, 227, 0, 0.72), rgba(7, 255, 169, 0.62), rgba(0, 116, 255, 0.82), rgba(200, 58, 255, 0.84), rgba(255, 0, 112, 0.9)),
        radial-gradient(ellipse at 12% 24%, rgba(255, 255, 255, 0.5), transparent 24%),
        radial-gradient(ellipse at 80% 76%, rgba(255, 255, 255, 0.34), transparent 30%);
      filter: blur(7px) saturate(1.18);
      transform: translate3d(-6%, -4%, 0) rotate(var(--rainbow-r, -10deg));
      animation: foilShift 6.8s ease-in-out infinite alternate;
    }

    .foil-sheet::after {
      inset: 0;
      opacity: var(--fold-opacity, 0.72);
      mix-blend-mode: overlay;
      background:
        linear-gradient(103deg, transparent 0 20%, rgba(255, 255, 255, 0.5) 24%, transparent 30% 100%),
        linear-gradient(78deg, transparent 0 43%, rgba(0, 0, 0, 0.72) 51%, transparent 58%),
        radial-gradient(ellipse at 82% 20%, rgba(255, 255, 255, 0.58), transparent 18%),
        radial-gradient(ellipse at 28% 84%, rgba(0, 0, 0, 0.54), transparent 32%),
        linear-gradient(164deg, transparent 0 58%, rgba(0, 0, 0, 0.62) 64%, transparent 70%),
        linear-gradient(90deg, rgba(255, 255, 255, 0.24), transparent 18% 78%, rgba(0, 0, 0, 0.56));
    }

    .foil-light {
      inset: -12%;
      mix-blend-mode: color-dodge;
      opacity: var(--streak-opacity, 0.62);
      background:
        linear-gradient(var(--streak-angle, 104deg), transparent 0 34%, rgba(255, 255, 255, 0.88) 40%, rgba(255, 255, 255, 0.08) 46%, transparent 52%),
        linear-gradient(calc(var(--streak-angle, 104deg) + 33deg), transparent 0 62%, rgba(255, 255, 255, 0.54) 68%, transparent 74%);
      filter: blur(1px);
      animation: foilGlint 4.9s ease-in-out infinite alternate;
    }

    .foil-grain {
      inset: 0;
      opacity: 0.2;
      mix-blend-mode: soft-light;
      background:
        repeating-linear-gradient(91deg, rgba(255, 255, 255, 0.2) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(14deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 5px);
    }

    .foil-card.foil-wide .foil-sheet {
      border-radius: 8px 18px 16px 6px;
    }

    .foil-card.foil-tall .foil-sheet::after {
      background:
        linear-gradient(95deg, transparent 0 18%, rgba(255, 255, 255, 0.42) 23%, transparent 30%),
        linear-gradient(86deg, transparent 0 50%, rgba(0, 0, 0, 0.76) 59%, transparent 66%),
        radial-gradient(ellipse at 74% 16%, rgba(255, 255, 255, 0.66), transparent 17%),
        radial-gradient(ellipse at 18% 78%, rgba(0, 0, 0, 0.5), transparent 31%),
        linear-gradient(90deg, rgba(255, 255, 255, 0.3), transparent 15% 74%, rgba(0, 0, 0, 0.62));
    }

    .foil-card.foil-wide .foil-sheet::before {
      background:
        conic-gradient(from 150deg at 52% 62%, rgba(255, 60, 0, 0.8), rgba(245, 255, 0, 0.58), rgba(0, 246, 210, 0.42), rgba(41, 85, 255, 0.7), rgba(255, 0, 208, 0.64), rgba(255, 60, 0, 0.8)),
        radial-gradient(ellipse at 18% 28%, rgba(255, 255, 255, 0.46), transparent 24%),
        radial-gradient(ellipse at 88% 78%, rgba(255, 255, 255, 0.36), transparent 22%);
    }

    @keyframes foilShift {
      from {
        transform: translate3d(-8%, -5%, 0) rotate(var(--rainbow-r, -10deg)) scale(1);
      }
      to {
        transform: translate3d(4%, 3%, 0) rotate(calc(var(--rainbow-r, -10deg) + 8deg)) scale(1.08);
      }
    }

    @keyframes foilGlint {
      from {
        transform: translateX(-4%) rotate(0deg);
      }
      to {
        transform: translateX(5%) rotate(1deg);
      }
    }

    .asset-sticker {
      width: 100%;
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .asset-sticker img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.35));
    }

    .collage-item[data-id="old-nm-logo"] .old-logo-animation {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(0) invert(1) !important;
      user-select: none;
      -webkit-user-drag: none;
    }

    .asset-sticker.soft-tile {
      padding: 7px;
      border-radius: 24px;
      background: rgba(13, 13, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .asset-sticker.shape-rect,
    .asset-sticker.shape-soft,
    .asset-sticker.shape-arch,
    .asset-sticker.shape-circle,
    .asset-sticker.shape-squircle,
    .asset-sticker.shape-cut,
    .asset-logo-card.shape-rect,
    .asset-logo-card.shape-soft,
    .asset-logo-card.shape-arch,
    .asset-logo-card.shape-circle,
    .asset-logo-card.shape-squircle,
    .asset-logo-card.shape-cut {
      aspect-ratio: var(--ratio, 1 / 1);
      overflow: hidden;
    }

    .asset-sticker.shape-rect img,
    .asset-sticker.shape-soft img,
    .asset-sticker.shape-arch img,
    .asset-sticker.shape-circle img,
    .asset-sticker.shape-squircle img,
    .asset-sticker.shape-cut img,
    .asset-logo-card.shape-rect img,
    .asset-logo-card.shape-soft img,
    .asset-logo-card.shape-arch img,
    .asset-logo-card.shape-circle img,
    .asset-logo-card.shape-squircle img,
    .asset-logo-card.shape-cut img {
      width: 100%;
      height: 100%;
      object-fit: var(--fit, cover);
      object-position: var(--pos, center);
    }

    .asset-logo-card {
      width: 100%;
      aspect-ratio: 1;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
    }

    .asset-logo-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .text-card {
      padding: 16px 17px;
      border-radius: 5px;
      color: var(--text, #f4f0e8);
      background: var(--fill, #1a3c74);
    }

    .text-card strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.1;
      font-style: italic;
      letter-spacing: 0;
    }

    .text-card span {
      display: block;
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .ticket-card {
      aspect-ratio: 1;
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 14px;
      color: #360022;
      background: #ff69d3;
    }

    .ticket-grid {
      height: 68px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 1fr;
      gap: 2px;
    }

    .ticket-grid i {
      display: block;
      background: rgba(93, 0, 72, 0.36);
    }

    .ticket-card h2 {
      margin: 0;
      max-width: 130px;
      font-size: 18px;
      line-height: 0.98;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .ticket-card p {
      margin: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .device-card {
      aspect-ratio: 1.56;
      display: grid;
      place-items: center;
      border-radius: 3px;
      background: linear-gradient(180deg, #e9eaec, #c9ccd1);
      border: 1px solid #202124;
    }

    .device-card svg {
      width: 28px;
      color: #101010;
    }

    .pixel9-card {
      position: relative;
      aspect-ratio: 72 / 154;
      padding: 4px;
      border-radius: 25px;
      background:
        linear-gradient(90deg, #050608, #2c3139 7%, #10131a 15% 85%, #363b45 93%, #050608),
        linear-gradient(180deg, #252a33, #050608 18% 82%, #282d36);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 5px 0 7px rgba(255, 255, 255, 0.08),
        inset -7px 0 13px rgba(0, 0, 0, 0.72),
        0 30px 48px rgba(0, 0, 0, 0.52);
    }

    .pixel9-card::before,
    .pixel9-card::after {
      content: "";
      position: absolute;
      right: -3px;
      width: 2px;
      border-radius: 999px;
      background: linear-gradient(#313846, #11131a);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .pixel9-card::before {
      top: 48px;
      height: 30px;
    }

    .pixel9-card::after {
      top: 91px;
      height: 54px;
    }

    .pixel9-screen {
      position: relative;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #050507;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 0 0 1px #050507,
        inset 0 0 18px rgba(108, 93, 255, 0.12);
    }

    .pixel9-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        linear-gradient(102deg, transparent 0 47%, rgba(255, 255, 255, 0.16) 50%, transparent 54%),
        radial-gradient(ellipse at 70% 18%, rgba(255, 255, 255, 0.16), transparent 30%);
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    .pixel9-shot {
      position: absolute;
      inset: 16px 2px 7px;
      border-radius: 18px 18px 20px 20px;
      overflow: hidden;
      background: #0c0714;
    }

    .pixel9-shot img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
    }

    .pixel9-status {
      position: absolute;
      inset: 0 5px auto;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 7px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 5px;
      font-weight: 700;
      letter-spacing: 0;
      background: #050507;
      z-index: 3;
    }

    .pixel9-status-icons {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .pixel9-signal,
    .pixel9-battery {
      display: block;
      height: 4px;
      border-radius: 1px;
      border: 1px solid rgba(255, 255, 255, 0.78);
    }

    .pixel9-signal {
      width: 6px;
      border-top: 0;
      border-left: 0;
      transform: skewX(-16deg);
    }

    .pixel9-battery {
      width: 9px;
      position: relative;
    }

    .pixel9-battery::after {
      content: "";
      position: absolute;
      top: 1px;
      right: -2px;
      width: 1px;
      height: 2px;
      border-radius: 0 1px 1px 0;
      background: rgba(255, 255, 255, 0.78);
    }

    .pixel9-camera {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 62% 38%, rgba(106, 123, 172, 0.9) 0 1px, transparent 2px),
        radial-gradient(circle, #08090d 0 42%, #1c2030 43% 62%, #050507 63%);
      z-index: 4;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .pixel9-browser {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 19px;
      height: 11px;
      z-index: 4;
      display: flex;

        let hash = 0;
        for (let index = 0; index < value.length; index += 1) {
          hash = (hash * 31 + value.charCodeAt(index)) >>> 0;
        }
        return hash;
      };

      const getAlphaContext = (img) => {
        if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return null;
        if (alphaHitCanvases.has(img)) return alphaHitCanvases.get(img);
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        try {
          context.drawImage(img, 0, 0);
          context.getImageData(0, 0, 1, 1);
          alphaHitCanvases.set(img, context);
          return context;
        } catch {
          alphaHitCanvases.set(img, null);
          return null;

        const img = item.querySelector("img");
        const context = getAlphaContext(img);
        if (!context) return true;

        const point = stagePoint(event);
        const left = toNumber(item.style.left);
        const top = toNumber(item.style.top);
        const width = item.offsetWidth;
        const height = item.offsetHeight;
        const radians = (toNumber(getComputedStyle(item).getPropertyValue("--r")) * Math.PI) / 180;
        const dx = point.x - (left + width / 2);
        const dy = point.y - (top + height / 2);
        const localX = dx * Math.cos(-radians) - dy * Math.sin(-radians) + width / 2;
        const localY = dx * Math.sin(-radians) + dy * Math.cos(-radians) + height / 2;

        if (localX < 0 || localY < 0 || localX >= width || localY >= height) return false;

        const pixelX = Math.floor((localX / width) * img.naturalWidth);
        const pixelY = Math.floor((localY / height) * img.naturalHeight);

        const hoverLift = -(((hash >>> 7) % 4) + 1);
        const hoverScale = 1 + ((hash >>> 11) % 8) / 1000;
        initial.set(item.dataset.id, {
          x: toNumber(styles.left),
          y: toNumber(styles.top),
          z: Number(styles.zIndex) || 1
        });
        item.style.left = `${toNumber(styles.left)}px`;
        item.style.top = `${toNumber(styles.top)}px`;
        item.style.setProperty("--hover-r", `${hoverRotation.toFixed(1)}deg`);
        item.style.setProperty("--hover-y", `${hoverLift}px`);
        item.style.setProperty("--hover-scale", hoverScale.toFixed(3));
      });

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const clampCamera = () => {
        if (!camera.mobile) return;
        const scaledWidth = STAGE_WIDTH * camera.scale;
        const scaledHeight = STAGE_HEIGHT * camera.scale;
        const inset = 72;
        const minLeft = Math.min(window.innerWidth - scaledWidth - inset, inset);
        const maxLeft = inset;
        const minTop = Math.min(viewport.clientHeight - scaledHeight - inset, inset);
        const maxTop = inset;
        camera.left = clamp(camera.left, minLeft, maxLeft);
        camera.top = clamp(camera.top, minTop, maxTop);
      };

      const applyCamera = () => {
        document.documentElement.style.setProperty("--stage-scale", camera.scale.toFixed(4));
        board.style.left = `${camera.left}px`;
        board.style.top = `${camera.top}px`;
        document.documentElement.classList.add("stage-ready");
      };

      const fitStage = () => {
        const useMobileStage = mobileQuery.matches;
        const previous = { ...camera };
        const scale = useMobileStage
          ? clamp(Math.max(window.innerWidth / 760, viewport.clientHeight / 960), 0.54, 0.84)
          : Math.min(window.innerWidth / STAGE_WIDTH, viewport.clientHeight / STAGE_HEIGHT, 1);

        camera.mobile = useMobileStage;
        camera.scale = scale;

        if (useMobileStage) {
          if (!previous.mobile) {
            camera.left = window.innerWidth / 2 - MOBILE_FOCUS_X * scale;
            camera.top = (viewport.clientHeight - STAGE_HEIGHT * scale) / 2;
          } else {
            const centerX = (window.innerWidth / 2 - previous.left) / previous.scale;
            const centerY = (viewport.clientHeight / 2 - previous.top) / previous.scale;
            camera.left = window.innerWidth / 2 - centerX * scale;
            camera.top = viewport.clientHeight / 2 - centerY * scale;
          }
          clampCamera();
          applyCamera();
          return;
        }

        camera.left = (window.innerWidth - STAGE_WIDTH * scale) / 2 + DESKTOP_VISUAL_OFFSET_X * scale;
        camera.top = (viewport.clientHeight - STAGE_HEIGHT * scale) / 2;
        applyCamera();
      };

      const panCamera = (deltaX, deltaY) => {
        if (!camera.mobile) return;
        camera.left += deltaX;
        camera.top += deltaY;
        clampCamera();
        applyCamera();
      };

      const startCameraPan = (event) => {
        if (!camera.mobile) return;
        cameraPan = {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY
        };
        board.setPointerCapture(event.pointerId);
      };

      const endCameraPan = (event) => {
        if (!cameraPan || cameraPan.pointerId !== event.pointerId) return false;
        board.releasePointerCapture(event.pointerId);
        cameraPan = null;
        clearAlphaMiss();
        return true;
      };

      const stagePoint = (event) => {
        const rect = board.getBoundingClientRect();
        const scale = camera.scale || rect.width / STAGE_WIDTH;
        return {
          x: (event.clientX - rect.left) / scale,
          y: (event.clientY - rect.top) / scale,
          scale
        };
      };

      const saveLayout = () => {};

      const restoreLayout = () => {
        try {
          const layout = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          items.forEach((item) => {
            const saved = layout[item.dataset.id];
            if (!saved) return;
            item.style.left = `${saved.x}px`;
            item.style.top = `${saved.y}px`;
            item.style.zIndex = initial.get(item.dataset.id).z;
          });
          topZ = Math.max(...items.map((item) => Number(getComputedStyle(item).zIndex) || 1));
        } catch {
          localStorage.removeItem(STORAGE_KEY);
        }
      };

      localStorage.removeItem(STORAGE_KEY);
      let lastRelease = null;

      const startDrag = (item, event) => {
        if (!item) return;
        const point = stagePoint(event);
        active = {
          item,
          pointerId: event.pointerId,
          startX: point.x,
          startY: point.y,
          moved: false,
          offsetX: point.x - toNumber(item.style.left),
          offsetY: point.y - toNumber(item.style.top),
          originalZ: Number(getComputedStyle(item).zIndex) || initial.get(item.dataset.id).z
        };
        topZ += 1;
        item.style.zIndex = topZ;
        item.classList.add("is-dragging");
        item.setPointerCapture(event.pointerId);
      };

      board.addEventListener("pointerdown", (event) => {
        let item = event.target.closest(".collage-item");
        if (!item) {
          startCameraPan(event);
          return;
        }
        if (!hitsVisiblePixel(item, event)) {
          item = itemFromPoint(event, item);
          if (!item || !hitsVisiblePixel(item, event)) {
            startCameraPan(event);
            return;
          }
        }
        startDrag(item, event);
      });

      board.addEventListener("pointermove", (event) => {
        if (cameraPan) {
          if (cameraPan.pointerId !== event.pointerId) return;
          panCamera(event.clientX - cameraPan.clientX, event.clientY - cameraPan.clientY);
          cameraPan.clientX = event.clientX;
          cameraPan.clientY = event.clientY;
          return;
        }
        if (!active) {
          updateAlphaCursor(event);
          return;
        }
        if (active.pointerId !== event.pointerId) return;
        const point = stagePoint(event);
        if (Math.hypot(point.x - active.startX, point.y - active.startY) > 4) {
          active.moved = true;
        }
        active.item.style.left = `${point.x - active.offsetX}px`;
        active.item.style.top = `${point.y - active.offsetY}px`;
      });

      const fallen = new Set();
      const fallAway = (item) => {
        fallen.add(item);
        item.style.pointerEvents = "none";
        const start = performance.now();
        const y = toNumber(item.style.top);
        const rotation = toNumber(getComputedStyle(item).getPropertyValue("--r"));
        const frame = (now) => {
          const t = (now - start) / 1000;
          item.style.top = `${y + 100 * t + 900 * t * t}px`;
          item.style.transform = `rotate(${rotation + 180 * t + 300 * t * t}deg)`;
          if (t < 2) requestAnimationFrame(frame);
          else item.hidden = true;
        };
        requestAnimationFrame(frame);
      };
      const endDrag = (event) => {
        if (!active || active.pointerId !== event.pointerId) return;
        active.item.classList.remove("is-dragging");
        active.item.releasePointerCapture(event.pointerId);
        active.item.style.zIndex = active.originalZ;
        lastRelease = {
          item: active.item,
          moved: active.moved,
          time: performance.now()
        };
        if (event.type === "pointerup" && active.moved && Math.random() < 0.1) fallAway(active.item);
        saveLayout();
        active = null;
      };

      board.addEventListener("pointerup", (event) => {
        if (endCameraPan(event)) return;
        endDrag(event);
      });
      board.addEventListener("pointercancel", (event) => {
        if (endCameraPan(event)) return;
        endDrag(event);
      });
      board.addEventListener("pointerleave", clearAlphaMiss);

      board.addEventListener("click", (event) => {
        const item = event.target.closest(".collage-item");
        if (!item?.matches("a[href]")) return;
        const justDragged =
          lastRelease?.item === item &&
          lastRelease.moved &&
          performance.now() - lastRelease.time < 350;
        if (justDragged) event.preventDefault();
      });

      window.addEventListener("resize", fitStage);
      mobileQuery.addEventListener("change", fitStage);
      fitStage();
    })();
  </script>
<script src="portfolio-config.js?v=6"></script>
